<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Video Digest</title>
<meta name="description" content="Video Digest: видео- и аудиозапись → документ. Транскрипт, тезисы с таймкодами, критика аргументации, три уровня чтения.">
<!-- Light variant of index.html, from docs/design/video-digest-slide-light.html (Claude Design). -->
<link rel="stylesheet" href="fonts.css">
<style>
:root { --type-hero: 128px; --type-subtitle: 40px; --type-body: 26px; --type-mono: 30px; --type-small: 24px; --pad-x: 72px; --pad-top: 72px; --pad-bottom: 56px; --gap-col: 64px; }
html, body { margin:0; padding:0; width:100%; height:100%; background:#fafafa; overflow:hidden; }
body { display:flex; align-items:center; justify-content:center; }
#stage { width:min(100vw, 177.7778vh); aspect-ratio:16/9; position:relative; overflow:hidden; }
#slide { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform:translate(-50%,-50%) scale(var(--s)); transform-origin:center; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 3px solid #4f46e5; outline-offset: 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="stage">
<section id="slide" style="background:#fafafa; color:#18181b; font-family:'IBM Plex Sans', sans-serif; display:flex; flex-direction:column; padding:var(--pad-top) var(--pad-x) var(--pad-bottom); box-sizing:border-box; gap:48px;">
  <div style="display:flex; gap:var(--gap-col); flex:1; min-height:0;">
    <div style="width:560px; flex:none; display:flex; flex-direction:column; justify-content:space-between;">
      <div style="display:flex; flex-direction:column; gap:28px;">
        <h1 style="margin:0; font-size:var(--type-hero); line-height:0.95; font-weight:700; letter-spacing:-0.03em;">Video Digest</h1>
        <p style="margin:0; font-size:var(--type-subtitle); line-height:1.2; font-weight:500; color:#18181b;">Видео- и аудиозапись → документ</p>
        <p style="margin:0; font-size:var(--type-body); line-height:1.4; color:#52525b; text-wrap:pretty;">Транскрипт · тезисы с таймкодами · критика аргументации · три уровня чтения</p>
      </div>
      <div style="display:flex; flex-direction:column; gap:20px; align-items:flex-start;">
        <a href="https://digest.inforobot.space" title="digest.inforobot.space" style="display:block; width:300px; height:300px; background:#ffffff; border:1px solid #e4e4e7; border-radius:12px; box-sizing:border-box; padding:16px;">
          <img src="img/qr-light.svg" alt="QR digest.inforobot.space" style="width:100%; height:100%; display:block;">
        </a>
        <a href="https://digest.inforobot.space" style="font-family:'IBM Plex Mono', monospace; font-size:var(--type-mono); color:#18181b;">digest.inforobot.space</a>
      </div>
    </div>
    <div style="flex:1; min-width:0; display:flex; align-items:center;">
      <img src="img/architecture-light.png" alt="Архитектура Video Digest" style="width:100%; height:auto; display:block; border-radius:16px; border:1px solid #e4e4e7; box-sizing:border-box;">
    </div>
  </div>
  <div style="display:flex; flex-direction:column; gap:18px; flex:none;">
    <div style="display:flex; gap:4px; height:12px;">
      <div style="flex:5; background:#d4d4d8; border-radius:2px;"></div>
      <div style="flex:9; background:#a1a1aa; border-radius:2px;"></div>
      <div style="flex:14; background:#4f46e5; border-radius:2px;"></div>
      <div style="flex:7; background:#a1a1aa; border-radius:2px;"></div>
      <div style="flex:11; background:#0d9488; border-radius:2px;"></div>
      <div style="flex:8; background:#d4d4d8; border-radius:2px;"></div>
      <div style="flex:6; background:#e4e4e7; border-radius:2px;"></div>
    </div>
    <p style="margin:0; font-family:'IBM Plex Mono', monospace; font-size:var(--type-small); color:#52525b; letter-spacing:0.02em;">6 дней · 3 инструмента · 1 человек · 175 тестов · CI/CD</p>
  </div>
</section>
</div>
<script>
(function(){var s=document.getElementById('stage');function f(){document.documentElement.style.setProperty('--s',s.clientWidth/1920);}addEventListener('resize',f);f();})();
</script>
</body>
</html>
