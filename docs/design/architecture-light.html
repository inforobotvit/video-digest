<title id="vd-arch-title">Video Digest – от ссылки до документа</title>
<desc id="vd-arch-desc">Архитектура сервиса: фронт и nginx, оркестрация в n8n (jobs-api, pipeline и четыре служебных флоу: llm-call, on-error, log-events, maintenance), Media Service и Postgres с пятью таблицами в одном docker compose; Cloudflare Turnstile проверяет браузер, Deepgram распознаёт речь, OpenAI делает чистку, выжимку и критику – оба провайдера заменяются локальными через переменные окружения; внизу этапы от ссылки до документа.</desc>
