# Example of the outer proxy in front of the web container: nginx on the host, the domain -> 127.0.0.1:8080.
# The domain below is an example (the reference instance); put your own into server_name.
# HTTP only as written: get a certificate any way you like and add the 443 server and the redirect to it.
server {
    listen 80;
    listen [::]:80;
    server_name digest.inforobot.space;

    # Uploads up to UPLOAD_MAX_MB (200) go through this proxy; the inner nginx refuses larger bodies with
    # a contract-shaped 413. A slow channel: the timeout is between two reads of the body, not for the whole upload.
    client_max_body_size 200m;
    client_body_timeout 120s;

    # Rate limits per client address live in the inner nginx (infra/nginx.conf, zones per route, 429 with a JSON
    # body): it keys on X-Real-IP set below, so this proxy must keep sending it. No limits here on purpose – one
    # place, tested locally with the same config that runs in the container.

    # No request log: IP addresses are not stored (policy, 2026-09-17). Diagnostics live in the jobs and
    # events tables; rate limiting will be done by nginx itself without a log. The error log stays at
    # crit so that failed requests do not leave client addresses behind either.
    access_log off;
    error_log /var/log/nginx/digest.error.log crit;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running API calls (probe, export) and slow uploads.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
