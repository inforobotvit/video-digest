# Rate limits per client address (2026-09-21, step D of the release plan). Zones are separate: one common rate would
# break the waiting page, which polls the status every 3 s (10 s in a background tab, frontend/src/lib/usePolling.ts).
# Behind the VPS nginx every request arrives from the docker bridge, so the client address is taken from X-Real-IP
# when the request comes from a private range (the outer proxy sets it); locally there is no header and the bridge
# address is the client – every local test shares one bucket, which is what the checks below rely on.
# Refusals answer 429 with a contract-shaped JSON body (code rate_limited); they are not logged on purpose: the
# error log stays at crit so that no client address is stored (policy draft, decision 2026-09-21).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Real-IP;
limit_req_zone $binary_remote_addr zone=jobs:1m rate=2r/m;      # POST /api/jobs and retry: the dear one – 2 a minute, burst 3
limit_req_zone $binary_remote_addr zone=probe:1m rate=10r/m;    # POST /api/probe (links and uploads): 10 a minute, burst 5
limit_req_zone $binary_remote_addr zone=status:1m rate=2r/s;    # GET status: 3 s polling = 20 a minute a tab; 2 r/s allows six foreground tabs, burst 30 for a batch of tabs opening
limit_req_zone $binary_remote_addr zone=export:1m rate=6r/m;    # exports: a person clicks a few formats; each is a document build
limit_req_zone $binary_remote_addr zone=feedback:1m rate=3r/m;  # POST /api/feedback: one answer per job, a person rates a job or two a day; burst 3
limit_req_zone $binary_remote_addr zone=limits:1m rate=10r/m;   # GET /api/limits: one call per home page load; burst 5 for a few reloads in a row
limit_conn_zone $binary_remote_addr zone=perip:1m;              # concurrent connections per address (uploads)
limit_req_status 429;
limit_conn_status 429;

server {
  listen 80;
  root /usr/share/nginx/html;
  # UPLOAD_MAX_MB = 200 along the whole chain: this limit, the VPS nginx, the front's pre-check, the media service
  # (.env) and n8n's own form-data limit (N8N_FORMDATA_FILE_SIZE_MAX, 200 MB by default).
  client_max_body_size 200m;
  # A slow channel: 200 MB take minutes; the timeout is between two reads of the body, not for the whole upload.
  client_body_timeout 120s;

  # No request log and errors from crit only: client addresses are not stored (policy, 2026-09-17; the inner nginx
  # logged to stdout until 2026-09-21 – found while adding the limits).
  access_log off;
  error_log /dev/stderr crit;

  # The client address stops here (2026-09-30): the real_ip module has already turned X-Real-IP into $remote_addr
  # for the limits above, and n8n's Webhook node stores every request header in the execution data (found with a
  # marked X-Real-IP: the address sat in execution_data for the 7 days of EXECUTIONS_DATA_MAX_AGE). Both headers
  # are sent empty, which makes nginx drop them from the proxied request.
  proxy_set_header X-Real-IP "";
  proxy_set_header X-Forwarded-For "";

  # Contract-shaped bodies for nginx's own refusals, so the front shows its text by code instead of an html page.
  error_page 413 = @too_large;
  error_page 429 = @rate_limited;
  location @too_large { default_type application/json; return 413 '{"error":{"code":"file_too_large","message":"file exceeds UPLOAD_MAX_MB=200"}}'; }
  location @rate_limited { default_type application/json; return 429 '{"error":{"code":"rate_limited","message":"too many requests from your address, wait a minute"}}'; }

  # Upstreams are addressed through variables so nginx re-resolves them via Docker DNS instead of
  # caching the IP at startup: a recreated n8n or media container would otherwise leave nginx on a dead IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $n8n http://n8n:5678;
  set $media http://media:8000;

  # n8n cannot expose /jobs/:id without a webhookId prefix, so job routes map to static webhooks.
  location ~ ^/api/jobs/([A-Za-z0-9_]+)$ {
    limit_req zone=status burst=30 nodelay;
    limit_conn perip 20;
    proxy_pass $n8n/webhook/job-status?job_id=$1;
    proxy_read_timeout 120s;
  }
  location ~ ^/api/jobs/([A-Za-z0-9_]+)/retry$ {
    limit_req zone=jobs burst=3 nodelay;
    limit_conn perip 20;
    proxy_pass $n8n/webhook/job-retry?job_id=$1;
    proxy_read_timeout 120s;
  }
  location ~ ^/api/jobs/([A-Za-z0-9_]+)/export/([A-Za-z0-9_.]+)$ {
    limit_req zone=export burst=6 nodelay;
    limit_conn perip 20;
    proxy_pass $n8n/webhook/job-export?job_id=$1&format=$2;
    proxy_read_timeout 120s;
  }
  # Playback for uploads: n8n answers with X-Accel-Redirect to /media-internal/..., nginx streams the
  # file from the media service itself, Range included. No request limit here: the player sends a Range
  # request on every seek; the duration and size caps bound this already. Connections are still capped.
  location ~ ^/api/jobs/([A-Za-z0-9_]+)/media$ {
    limit_conn perip 20;
    proxy_pass $n8n/webhook/job-media?job_id=$1;
  }
  location /media-internal/ {
    internal;
    # With a variable in proxy_pass the URI is not rewritten by the location prefix, hence the explicit rewrite.
    rewrite ^/media-internal/(.*)$ /artifacts/$1 break;
    proxy_pass $media;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    # proxy_set_header is inherited only when a location has none of its own: repeat the address stripping.
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
  }

  # Public health probe for CI and the web container healthcheck: passes through to the media service.
  location = /health {
    proxy_pass $media/health;
    access_log off;
  }

  # POST /api/jobs: the dear one.
  location = /api/jobs {
    limit_req zone=jobs burst=3 nodelay;
    limit_conn perip 20;
    rewrite ^/api/(.*)$ /webhook/$1 break;
    proxy_pass $n8n;
    proxy_read_timeout 120s;
  }
  # GET /api/limits: the numbers the form prints (2026-09-30); a read of the settings table, its own small zone.
  location = /api/limits {
    limit_req zone=limits burst=5 nodelay;
    limit_conn perip 20;
    rewrite ^/api/(.*)$ /webhook/$1 break;
    proxy_pass $n8n;
    proxy_read_timeout 30s;
  }

  # POST /api/feedback: the survey; one answer per job is enforced by the table, the zone stops scripts.
  location = /api/feedback {
    limit_req zone=feedback burst=3 nodelay;
    limit_conn perip 20;
    rewrite ^/api/(.*)$ /webhook/$1 break;
    proxy_pass $n8n;
    proxy_read_timeout 120s;
  }
  # POST /api/probe: links and uploads; three uploads at a time from one address, not fifty.
  location = /api/probe {
    limit_req zone=probe burst=5 nodelay;
    limit_conn perip 3;
    rewrite ^/api/(.*)$ /webhook/$1 break;
    proxy_pass $n8n;
    # The body is buffered here first, then handed to n8n, which stores the file and probes it: a 200 MB file
    # needs more than the 120 s of the other routes.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /api/ {
    limit_conn perip 20;
    rewrite ^/api/(.*)$ /webhook/$1 break;
    proxy_pass $n8n;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
